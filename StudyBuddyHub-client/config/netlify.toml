[build]
  publish = "dist"
  functions = "backend/netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"
  included_files = ["backend/data/catalog.json", "backend/data/demo-content.json", "backend/data/page-assets.json"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/resources/:slug?"
  query = { page = ":slug" }
  status = 301
  force = true

[[redirects]]
  from = "/courses/*"
  to = "/.netlify/functions/api/courses/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/resources/*"
  to = "/.netlify/functions/api/resources/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/api/sitemap.xml"
  status = 200
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-ancestors 'self' https://sakib-studio.netlify.app;"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
